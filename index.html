<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Alles in %…% wird beim Bauen aus src/content.ts eingesetzt (siehe vite.config.ts) -->
    <title>%SITE_TITLE%</title>
    <meta name="description" content="%SITE_DESCRIPTION%" />

    <!-- Vorschau, wenn jemand den Link teilt (WhatsApp, Instagram …) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_AT" />
    <meta property="og:title" content="%SITE_TITLE%" />
    <meta property="og:description" content="%SITE_DESCRIPTION%" />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="%PREVIEW_IMAGE_ALT%" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Startbild früh laden: Es ist das Erste, was man sieht -->
    <link rel="preload" as="image" href="/%HERO_IMAGE%" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="max-width: 32rem; margin: 15vh auto; padding: 0 1rem; font-family: sans-serif; text-align: center">
        <h1>%SITE_TITLE%</h1>
        <p>%SITE_MOTTO%</p>
        <p>Diese Website braucht JavaScript. Bitte aktiviere es in deinem Browser.</p>
        <p><a href="%INSTAGRAM_URL%">CCS auf Instagram</a></p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
